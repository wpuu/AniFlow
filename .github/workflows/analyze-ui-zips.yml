name: Analyze uploaded Claude and Grok UI zips
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/audit_uploaded_frontends.py
      - scripts/audit_uploaded_frontends_details.py
      - scripts/audit_uploaded_frontends_transfer.py
      - src/aniflow/studio/**
      - apps/studio-mock-ui/**
      - tests/test_studio_mock_api.py
      - tests/fixtures/MOCK_BLUE_LOCAL_NO_AGNES.mp4
      - .github/workflows/analyze-ui-zips.yml
      - aniflow-ai-video-dashboard-claude.zip
      - aniflow-ai-video-dashboard-grok.zip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-archives:
    name: Read-only ZIP analysis, no npm, no AWS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect both user-uploaded candidate ZIP files offline
        run: python scripts/audit_uploaded_frontends.py
      - name: Inspect selected source for provider and task integration gaps
        run: python scripts/audit_uploaded_frontends_details.py

  transfer-grok-source:
    name: Read Grok candidate text sources as evidence (no execution)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/audit_uploaded_frontends_transfer.py --export-text

  build-candidates:
    name: Typecheck and build candidates in isolated CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run strict TypeScript checks and Vite build on both isolated candidates
        shell: bash
        run: |
          set +e
          for variant in Grok Claude; do
            workdir="/tmp/aniflow-ui-${variant}"
            python scripts/audit_uploaded_frontends_transfer.py --extract "$variant" --output "$workdir"
            cd "$workdir" || exit 1
            npm ci --ignore-scripts --no-audit --no-fund >"/tmp/${variant}-npm.log" 2>&1
            install_status=$?
            if [ "$install_status" -eq 0 ]; then
              ./node_modules/.bin/tsc --noEmit -p tsconfig.json >"/tmp/${variant}-typecheck.log" 2>&1
              typecheck_status=$?
              npm run build >"/tmp/${variant}-build.log" 2>&1
              build_status=$?
            else
              typecheck_status=99
              build_status=99
            fi
            echo "ANIFLOW_UI_BUILD_RESULT variant=${variant} npm_ci=$install_status strict_tsc=$typecheck_status vite_build=$build_status"
            if [ "$typecheck_status" -ne 0 ]; then tail -20 "/tmp/${variant}-typecheck.log" 2>/dev/null; fi
            if [ "$build_status" -ne 0 ]; then tail -20 "/tmp/${variant}-build.log" 2>/dev/null; fi
            cd "$GITHUB_WORKSPACE" || exit 1
          done
          echo "PASS_BOTH_CANDIDATES_AUDITED_NO_AWS_OR_REAL_VIDEO"

  mock-studio-api:
    name: Mock H3 image upload, durable jobs, local MP4, no AWS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public Python test requirements
        run: python -m pip install -e '.[dev]'
      - name: Test local Mock H3 complete flow and idempotency
        run: python -m pytest -q tests/test_studio_mock_api.py

  build-mock-ui:
    name: Build Grok-derived real Mock Bridge UI (no AWS)
    needs: [mock-studio-api]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile integrated Grok UI against mock-only API types
        working-directory: apps/studio-mock-ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/tsc --noEmit -p tsconfig.json
          npm run build
      - name: Validate same-origin UI and original ZIP logo are served
        run: |
          python -m pip install -e '.[dev]'
          python - <<'PY'
          from pathlib import Path
          from fastapi.testclient import TestClient
          from aniflow.studio.mock_api import create_mock_app
          with TestClient(create_mock_app(data_dir=Path('/tmp/aniflow-mock-studio-smoke'))) as c:
              page=c.get('/')
              assert page.status_code==200 and 'AniFlow' in page.text
              assert page.headers['Cache-Control'].startswith('no-store')
              logo=c.get('/images/logo.png')
              assert logo.status_code==200 and logo.content.startswith(b'\x89PNG\r\n\x1a\n')
              assert c.get('/api/studio/mock/health').json()['aws_state']=='NOT_CONNECTED'
          print('PASS_GROK_UI_SERVED_FROM_LOCAL_MOCK_BRIDGE_ZERO_GPU')
          PY

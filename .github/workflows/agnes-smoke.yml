name: Agnes Single-Key Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGNES_API_ROOT: https://apihub.agnes-ai.com
      AGNES_API_KEYS: ${{ secrets.AGNES_API_KEYS }}
      AGNES_TEXT_MODEL: agnes-2.5-flash
      AGNES_IMAGE_MODEL: agnes-image-2.1-flash
      AGNES_VIDEO_MODEL: agnes-video-2.5-flash
      ANIFLOW_ASPECT_RATIO: 9:16
      ANIFLOW_IMAGE_SIZE: 1K
      ANIFLOW_VIDEO_SECONDS: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate one Agnes key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AGNES_API_KEYS" || { echo 'Missing secret AGNES_API_KEYS'; exit 1; }

      - name: Install AniFlow
        run: pip install -e '.[dev]'

      - name: Run real Agnes smoke test
        run: python scripts/agnes_single_key_smoke.py | tee agnes-smoke-result.json

      - name: Upload smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aniflow-agnes-smoke-${{ github.run_id }}
          path: agnes-smoke-result.json
          if-no-files-found: warn
          retention-days: 7

name: P0-009 Agnes v7.1.0 no-key Windows startup

on:
  push:
    branches: ["audit/**", "main"]
    paths:
      - .github/workflows/p009-upstream-no-key-windows.yml
      - scripts/prepare_video_studio_v710.py
      - scripts/smoke_upstream_video_studio_v710.py
      - tests/test_smoke_upstream_video_studio_v710.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p009-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke-windows:
    name: Pinned upstream native Windows / no Key
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      AGNES_API_KEY: ""
      AGNES_CORS_ENABLED: "false"
      AGNES_CORS_ORIGINS: ""
      HOST: "127.0.0.1"
      PORT: "18765"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run no-key policy guard tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_smoke_upstream_video_studio_v710.py -v
          if ($LASTEXITCODE -ne 0) { throw "No-key policy unit checks failed" }

      - name: Check native Windows FFmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed" }
            $env:PATH = [Environment]::GetEnvironmentVariable("PATH", "Machine") + ";" + [Environment]::GetEnvironmentVariable("PATH", "User")
          }
          ffmpeg -version
          ffprobe -version

      - name: Fetch and verify official v7.1.0 source in isolated directory
        shell: pwsh
        run: |
          $upstream = Join-Path $env:RUNNER_TEMP "aniflow-upstream-v710"
          if (Test-Path $upstream) { throw "Upstream target unexpectedly exists" }
          python scripts/prepare_video_studio_v710.py --dest $upstream --install
          if ($LASTEXITCODE -ne 0) { throw "Pinned official source preparation failed" }
          python scripts/prepare_video_studio_v710.py --dest $upstream --verify-existing
          if ($LASTEXITCODE -ne 0) { throw "Official release SHA verification failed" }

      - name: Install native upstream Python dependencies (no user Key)
        shell: pwsh
        run: |
          $upstream = Join-Path $env:RUNNER_TEMP "aniflow-upstream-v710"
          python -m pip install -r (Join-Path $upstream "requirements.txt") "tzdata>=2025.2,<2028"
          if ($LASTEXITCODE -ne 0) { throw "Official upstream dependencies could not be installed" }

      - name: Boot stock upstream server on loopback and verify health
        shell: pwsh
        run: |
          $upstream = Join-Path $env:RUNNER_TEMP "aniflow-upstream-v710"
          python scripts/smoke_upstream_video_studio_v710.py --upstream $upstream --port 18765 --deadline-seconds 90
          if ($LASTEXITCODE -ne 0) { throw "Official upstream no-key native startup smoke failed" }

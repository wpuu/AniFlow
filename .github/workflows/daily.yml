name: Legacy Animation Factory (manual opt-in only)

# P0-023: do not schedule production before one real Agnes video, MP4 and
# current billing/rights acceptance. This draft-branch change does NOT disable
# the older scheduled workflow that still exists on main.
on:
  workflow_dispatch:
    inputs:
      confirm_single_batch:
        description: 'I checked real billing, rights and want to run a live manual batch'
        type: boolean
        required: true
        default: false
      character_id:
        description: 'Character ID; empty uses repository variable ANIFLOW_CHARACTER_ID'
        required: false
        type: string
      style:
        description: 'Style key; empty uses repository variable ANIFLOW_STYLE'
        required: false
        type: string
      count:
        description: 'Episode count; for this manual-only legacy path default 1'
        required: false
        default: '1'
        type: string
      concurrency:
        description: 'Parallel episode count; for this manual-only legacy path default 1'
        required: false
        default: '1'
        type: string

permissions:
  contents: write

concurrency:
  group: aniflow-daily
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ inputs.confirm_single_batch == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AGNES_API_ROOT: https://apihub.agnes-ai.com
      AGNES_API_KEYS: ${{ secrets.AGNES_API_KEYS }}
      AGNES_TEXT_MODEL: agnes-2.5-flash
      AGNES_IMAGE_MODEL: agnes-image-2.1-flash
      AGNES_VIDEO_MODEL: agnes-video-2.5-flash
      ANIFLOW_ASPECT_RATIO: 9:16
      ANIFLOW_IMAGE_SIZE: 1K
      ANIFLOW_VIDEO_SECONDS: 5
      ANIFLOW_CANDIDATES_PER_SEGMENT: ${{ vars.ANIFLOW_CANDIDATES_PER_SEGMENT || '5' }}
      ANIFLOW_MAX_REPAIR_ROUNDS: ${{ vars.ANIFLOW_MAX_REPAIR_ROUNDS || '2' }}
      ANIFLOW_PASS_SCORE: ${{ vars.ANIFLOW_PASS_SCORE || '82' }}
      ANIFLOW_TIMEZONE: ${{ vars.ANIFLOW_TIMEZONE || 'Asia/Shanghai' }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
      S3_REGION: ${{ vars.S3_REGION || 'auto' }}
      ANIFLOW_CHARACTER_ID: ${{ inputs.character_id || vars.ANIFLOW_CHARACTER_ID }}
      ANIFLOW_STYLE: ${{ inputs.style || vars.ANIFLOW_STYLE }}
      ANIFLOW_DAILY_COUNT: ${{ inputs.count || '1' }}
      ANIFLOW_DAILY_CONCURRENCY: ${{ inputs.concurrency || '1' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install AniFlow
        run: pip install -e '.[dev]'

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AGNES_API_KEYS" || { echo 'Missing secret AGNES_API_KEYS'; exit 1; }
          test -n "$S3_ENDPOINT_URL" || { echo 'Missing secret S3_ENDPOINT_URL'; exit 1; }
          test -n "$S3_ACCESS_KEY_ID" || { echo 'Missing secret S3_ACCESS_KEY_ID'; exit 1; }
          test -n "$S3_SECRET_ACCESS_KEY" || { echo 'Missing secret S3_SECRET_ACCESS_KEY'; exit 1; }
          test -n "$S3_BUCKET" || { echo 'Missing secret S3_BUCKET'; exit 1; }
          test -n "$S3_PUBLIC_BASE_URL" || { echo 'Missing secret S3_PUBLIC_BASE_URL'; exit 1; }
          test -n "$ANIFLOW_CHARACTER_ID" || { echo 'Missing repository variable ANIFLOW_CHARACTER_ID'; exit 1; }
          test -n "$ANIFLOW_STYLE" || { echo 'Missing repository variable ANIFLOW_STYLE'; exit 1; }
          aniflow doctor

      - name: Live Agnes and media preflight
        run: aniflow preflight

      - name: Generate daily batch
        shell: bash
        run: |
          set -euo pipefail
          aniflow daily \
            --character-id "$ANIFLOW_CHARACTER_ID" \
            --style "$ANIFLOW_STYLE" \
            --count "$ANIFLOW_DAILY_COUNT" \
            --concurrency "$ANIFLOW_DAILY_CONCURRENCY" \
            | tee daily-result.json

      - name: Save private generation history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/daily
          if git diff --cached --quiet; then
            echo 'No history changes to commit.'
          else
            git commit -m 'chore: record daily AniFlow generation'
            git push
          fi

      - name: Upload run manifest
        uses: actions/upload-artifact@v4
        with:
          name: aniflow-daily-${{ github.run_id }}
          path: |
            daily-result.json
            data/daily/runs/*.json
          if-no-files-found: warn
          retention-days: 14

name: CI

# One run per PR commit; avoid duplicate push + pull_request runs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only checks only: no API keys, publishing, releases, or uploads.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff (Python static checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lint tool
        run: python -m pip install 'ruff>=0.9,<1'
      - name: Ruff (must be independently fixed, never disabled)
        run: python -m ruff check src tests scripts/one_agnes_real_shot.py scripts/audit_wan_reference_assets.py scripts/build_nine_key_bundle.py

      - name: Verify pinned publicly reachable Agnes portrait URL (read-only, no Agnes Key)
        shell: bash
        run: |
          curl -fLsS --max-time 35 -o /tmp/agnes-pinned-portrait.png 'https://raw.githubusercontent.com/wpuu/AniFlow/4a09aa3d93f25f753c3379fd8bf4501427a266a0/assets/character/agnes-felt-test-frame.png'
          echo 'f0c2b7c330c10c6c2640934b75e66b572e47e578805a978a84c907aada9db60e  /tmp/agnes-pinned-portrait.png' | sha256sum -c -

      - name: Read-only Wan first-frame PNG technical audit (no Key or requests)
        run: python scripts/audit_wan_reference_assets.py

  frontend:
    name: Nine-Key Agnes frontend TypeScript and Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/grok-frontend/package-lock.json
      - name: Install pinned frontend dependencies
        working-directory: apps/grok-frontend
        run: npm ci
      - name: Unit-test persistent nine-Key video guard (no API/Key)
        working-directory: apps/grok-frontend
        run: node --experimental-strip-types --test tests/taskSafety.test.mjs tests/safeTrialReport.test.mjs tests/statusProgress.test.mjs
      - name: Type-check and build standalone frontend (no API/Key)
        working-directory: apps/grok-frontend
        run: npm run build
      - name: Share public compiled frontend within this CI run
        uses: actions/upload-artifact@v4
        with:
          name: internal-compiled-nine-key-ui
          path: apps/grok-frontend/dist/index.html
          retention-days: 1
          if-no-files-found: error

  tests:
    name: Pytest + doctor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed" }
            $env:PATH = [Environment]::GetEnvironmentVariable("PATH", "Machine") + ";" + [Environment]::GetEnvironmentVariable("PATH", "User")
          }
          ffmpeg -version
          ffprobe -version
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Full repository Pytest suite (no private keys)
        run: python -m pytest -q
      - name: Locked first-shot plan-only preview (never reads secrets or sends POST)
        shell: bash
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          run = subprocess.run(
              [sys.executable, "scripts/one_agnes_real_shot.py"],
              capture_output=True,
              check=True,
              text=True,
          )
          plan = json.loads(run.stdout)
          assert plan["result"] == "PLAN_ONLY_NO_REQUESTS"
          assert plan["submissions"] == 0
          assert plan["episode_id"] == "MYCL-001"
          assert plan["seconds"] == 5
          assert plan["model"] == "agnes-video-2.5-flash"
          assert plan["mode"] == "text"
          assert plan["resolution"] == "720P"
          assert plan["aspect_ratio"] == "9:16"
          assert not any("api_key" in key.lower() for key in plan)
          print("PASS_CLOUD_FIRST_SHOT_PLAN_ONLY_ZERO_POST")
          PY
      - name: AniFlow doctor
        run: aniflow doctor


  browser_e2e:
    name: Real Chromium E2E with fake Agnes only (never reads real Keys)
    needs: [frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only browser test packages and local app (no credentials)
        run: python -m pip install -e . playwright==1.56.0
      - name: Verify Chrome and FFmpeg
        shell: bash
        run: |
          command -v google-chrome
          if ! command -v ffmpeg; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Download the SAME frontend build as the nine-Key Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: internal-compiled-nine-key-ui
          path: apps/grok-frontend/dist
      - name: "Click through actual browser: first shot, recovery, reference, duplicate keys"
        shell: bash
        env:
          AGNES_API_KEYS: ''
          ANIFLOW_SINGLE_SHOT_API_KEY: ''
        run: python scripts/browser_e2e_check.py --screenshot e2e-results/MOCK-NO-REAL-AGNES-VIDEO.png
      - name: Share explicitly labeled simulated UI screenshot (not a generated video)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: browser-mock-proof
          path: e2e-results/MOCK-NO-REAL-AGNES-VIDEO.png
          if-no-files-found: error
          retention-days: 7

  bundle:
    name: Package existing nine-Key UI for Windows (no secrets)
    needs: [lint, frontend, tests, browser_e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch compiled frontend from this CI run
        uses: actions/download-artifact@v4
        with:
          name: internal-compiled-nine-key-ui
          path: apps/grok-frontend/dist
      - name: Build strict public-source-only test bundle
        shell: bash
        run: |
          python3 scripts/build_nine_key_bundle.py \
            --output-dir bundle-out/AniFlow-9Key \
            --source-commit "$(git rev-parse HEAD)"
      - name: Upload temporary CI test artifact (not a deployment or release)
        uses: actions/upload-artifact@v4
        with:
          name: AniFlow-9Key-Windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: bundle-out/AniFlow-9Key/
          if-no-files-found: error
          retention-days: 14

  windows_bundle_smoke:
    name: Verify downloaded Node-free Windows bundle (no credentials)
    needs: [bundle]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: AniFlow-9Key-Windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: bundle
      - name: Run actual Windows installer, validate local HTML and video routes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location bundle
          & powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\setup_aniflow_windows.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows bundle installer failed" }
          & ".\.venv\Scripts\python.exe" -c "from aniflow.bridge.app import create_bridge_app; from fastapi.testclient import TestClient; app=create_bridge_app(); c=TestClient(app); assert c.get('/').status_code == 200; assert c.get('/api/health').json()['frontend_ready']; paths=c.get('/openapi.json').json()['paths']; assert '/api/video/create' in paths; assert '/api/video/status' in paths; print('PASS_WINDOWS_BUNDLE_NO_NODE_NO_KEY')"
          if ($LASTEXITCODE -ne 0) { throw "Windows built-bundle Bridge smoke test failed" }

      - name: Start real Windows Bridge on localhost and GET compiled UI (zero Agnes calls)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location bundle
          $python = (Resolve-Path ".\.venv\Scripts\python.exe").Path
          $bridge = Start-Process -FilePath $python -ArgumentList @("-m", "aniflow.cli", "bridge") -WorkingDirectory (Get-Location).Path -PassThru -RedirectStandardOutput "bridge-smoke-out.txt" -RedirectStandardError "bridge-smoke-err.txt"
          try {
            $base = "http://127.0.0.1:8765"
            $healthy = $false
            for ($i = 0; $i -lt 35; $i++) {
              if ($bridge.HasExited) { throw "Bridge process exited before HTTP health became ready" }
              try {
                $h = Invoke-RestMethod -Uri "$base/api/health" -TimeoutSec 2
                if ($h.ok -eq $true -and $h.frontend_ready -eq $true) {
                  $healthy = $true
                  break
                }
              }
              catch { }
              Start-Sleep -Milliseconds 700
            }
            if (-not $healthy) { throw "Real Bridge never opened localhost:8765" }
            $page = Invoke-WebRequest -Uri "$base/" -UseBasicParsing -TimeoutSec 10
            if ($page.StatusCode -ne 200) { throw "Real Bridge did not serve the compiled UI" }
            if ($page.Content -notmatch "AniFlow") { throw "Compiled AniFlow frontend not found in live response" }
            $api = Invoke-RestMethod -Uri "$base/openapi.json" -TimeoutSec 10
            $routes = $api.paths.PSObject.Properties.Name
            if ($routes -notcontains "/api/video/create" -or $routes -notcontains "/api/video/status") {
              throw "Real server is missing required Agnes video routes"
            }
            $client = [System.Net.Http.HttpClient]::new()
            try {
              $request = [System.Net.Http.HttpRequestMessage]::new(
                [System.Net.Http.HttpMethod]::Get, "$base/api/health"
              )
              $request.Headers.Host = "127.0.0.1.rebind.invalid"
              $reply = $client.SendAsync($request).GetAwaiter().GetResult()
              if ([int]$reply.StatusCode -ne 400) { throw "DNS rebinding Host was not rejected" }
              $reply.Dispose()
              $request.Dispose()
            }
            finally { $client.Dispose() }
            Write-Host "PASS_WINDOWS_REAL_LOCALHOST_BRIDGE_UI_ROUTES_HOST_GUARD_ZERO_AGNES_REQUESTS"
          }
          finally {
            Stop-Process -Id $bridge.Id -Force -ErrorAction SilentlyContinue
            Wait-Process -Id $bridge.Id -ErrorAction SilentlyContinue
          }


name: CI

# One run per PR commit; avoid duplicate push + pull_request runs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only checks only: no API keys, publishing, releases, or uploads.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff (Python static checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lint tool
        run: python -m pip install 'ruff>=0.9,<1'
      - name: Ruff (must be independently fixed, never disabled)
        run: python -m ruff check src tests scripts/one_agnes_real_shot.py scripts/audit_wan_reference_assets.py

      - name: Read-only Wan first-frame PNG technical audit (no Key or requests)
        run: python scripts/audit_wan_reference_assets.py

  cors_probe:
    name: Agnes public OPTIONS preflight (no Key, no video task)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect browser CORS for local UI without any Authorization value
        shell: bash
        run: |
          set +e
          code=$(curl --silent --show-error --max-time 15 --output /dev/null \
            --dump-header /tmp/agnes-cors.txt --write-out '%{http_code}' \
            --request OPTIONS \
            --header 'Origin: http://127.0.0.1:8765' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: authorization,content-type' \
            'https://apihub.agnes-ai.com/v1/videos')
          rc=$?
          echo "NO_KEY_PREFLIGHT_HTTP=${code} CURL_EXIT=${rc}"
          grep -i -E '^(access-control-allow-origin|access-control-allow-methods|access-control-allow-headers|vary):' /tmp/agnes-cors.txt || true
          if [ "$rc" -eq 0 ] && grep -qi '^access-control-allow-origin:' /tmp/agnes-cors.txt; then
            echo 'CORS_HEADERS_PRESENT_CHECK_VALUES'
          else
            echo 'CORS_NOT_CONFIRMED_FOR_BROWSER'
          fi
          # Diagnostic only. This read-only probe never sends Authorization/POST.
          exit 0

  browser_cors_probe:
    name: Headless browser GET with intentionally fake bearer (no video POST)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test real browser preflight behavior without a real Key
        shell: bash
        run: |
          mkdir -p /tmp/aniflow-browser-cors
          cat > /tmp/aniflow-browser-cors/index.html <<'HTML'
          <!doctype html><html><body><div id="result">RUNNING</div>
          <script>
          fetch('https://apihub.agnes-ai.com/agnesapi?video_id=ANIFLOW_CORS_NOT_A_REAL_ID&model_name=agnes-video-2.5-flash', {
            method: 'GET',
            headers: { Authorization: 'Bearer ANIFLOW_TEST_SENTINEL_NOT_A_REAL_KEY' },
            cache: 'no-store',
          }).then(response => {
            document.getElementById('result').textContent = 'BROWSER_FETCH_ACCESSIBLE_STATUS_' + response.status;
          }).catch(error => {
            document.getElementById('result').textContent = 'BROWSER_FETCH_BLOCKED_' + error.name;
          });
          </script></body></html>
          HTML
          (cd /tmp/aniflow-browser-cors && python3 -m http.server 18765 --bind 127.0.0.1 >/dev/null 2>&1) &
          sleep 1
          if command -v google-chrome >/dev/null 2>&1; then
            timeout 27s google-chrome --headless --disable-gpu --no-sandbox \
              --disable-dev-shm-usage --virtual-time-budget=13000 \
              --dump-dom http://127.0.0.1:18765/ >/tmp/aniflow-browser-result.txt 2>/tmp/aniflow-chrome-err.txt || true
            grep -o 'BROWSER_FETCH_[A-Z_0-9]*' /tmp/aniflow-browser-result.txt | tail -n 1 || echo 'BROWSER_PROBE_INCONCLUSIVE'
            grep -i 'access-control-allow-headers.*authorization' /tmp/aniflow-chrome-err.txt | head -n 2 || true
          else
            echo 'BROWSER_NOT_INSTALLED_IN_RUNNER'
          fi
          # Do not send a real API Key and never create a video task.
          exit 0

  frontend:
    name: Nine-Key Agnes frontend TypeScript and Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/grok-frontend/package-lock.json
      - name: Install pinned frontend dependencies
        working-directory: apps/grok-frontend
        run: npm ci
      - name: Type-check and build standalone frontend (no API/Key)
        working-directory: apps/grok-frontend
        run: npm run build

  tests:
    name: Pytest + doctor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed" }
            $env:PATH = [Environment]::GetEnvironmentVariable("PATH", "Machine") + ";" + [Environment]::GetEnvironmentVariable("PATH", "User")
          }
          ffmpeg -version
          ffprobe -version
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Full repository Pytest suite (no private keys)
        run: python -m pytest -q
      - name: AniFlow doctor
        run: aniflow doctor

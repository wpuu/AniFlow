name: CI

# One run per PR commit; avoid duplicate push + pull_request runs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only checks only: no API keys, publishing, releases, or uploads.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff (Python static checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lint tool
        run: python -m pip install 'ruff>=0.9,<1'
      - name: Ruff (must be independently fixed, never disabled)
        run: python -m ruff check src tests scripts/one_agnes_real_shot.py scripts/audit_wan_reference_assets.py

      - name: Read-only Wan first-frame PNG technical audit (no Key or requests)
        run: python scripts/audit_wan_reference_assets.py

  frontend:
    name: Nine-Key Agnes frontend TypeScript and Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/grok-frontend/package-lock.json
      - name: Install pinned frontend dependencies
        working-directory: apps/grok-frontend
        run: npm ci
      - name: Unit-test persistent nine-Key video guard (no API/Key)
        working-directory: apps/grok-frontend
        run: node --experimental-strip-types --test tests/taskSafety.test.mjs
      - name: Type-check and build standalone frontend (no API/Key)
        working-directory: apps/grok-frontend
        run: npm run build

  tests:
    name: Pytest + doctor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed" }
            $env:PATH = [Environment]::GetEnvironmentVariable("PATH", "Machine") + ";" + [Environment]::GetEnvironmentVariable("PATH", "User")
          }
          ffmpeg -version
          ffprobe -version
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Full repository Pytest suite (no private keys)
        run: python -m pytest -q
      - name: AniFlow doctor
        run: aniflow doctor
